# PUPPF SANDBOX — one-static-binary floor, round 3 + receipt publication (2026-11-10).
# Source: Gemini seat proposals; verbatim copies under sandbox/incoming/.
# Z annotations carried from rounds 2-3 (workflow completion, permissions, timeout,
# chmod +x, pipefail, computed non-blocking gate, compile step, AGENT RESULT check)
# plus this round:
#   6. Receipt publication to the sandbox branch: after every run the QEMU log is
#      committed to sandbox/receipts/ so receipts live in the repo, readable by every
#      seat (bus precedent: island failure publication). This requires contents:write
#      for the publish step only in practice — sandbox branch is disposable territory
#      per charter; main route gates unaffected.
#   7. Loop guard (required): receipt commits carry [skip ci] AND the job skips when
#      the actor is github-actions[bot]. Without these, receipt-push -> rebuild ->
#      receipt-push is an unbounded minutes burn loop.
#      [skip ci] alone is honored by GitHub for push events; the actor guard is
#      belt-and-braces.

name: Puppf Sandbox Build & TCG Run

on:
  push:
    branches: [ "sandbox/gemini-lab-20261110" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sandbox-build-and-run:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            bc \
            rsync \
            cpio \
            unzip \
            wget \
            git \
            qemu-system-x86

      - name: Compile static agent-core
        run: |
          gcc -static -O2 -o board/puppf/overlay/bin/agent-core board/puppf/overlay/bin/agent-core.c
          chmod +x board/puppf/overlay/bin/agent-core
          file board/puppf/overlay/bin/agent-core

      - name: Build Buildroot Image Stack
        run: |
          git clone --depth 1 --branch 2026.08 https://git.buildroot.net/buildroot /tmp/buildroot
          cp configs/puppy_agent_defconfig /tmp/buildroot/configs/

          # Copy overlay into buildroot tree
          mkdir -p /tmp/buildroot/board/puppf/overlay
          cp -r board/puppf/overlay/* /tmp/buildroot/board/puppf/overlay/
          chmod +x /tmp/buildroot/board/puppf/overlay/init

          cd /tmp/buildroot
          make puppy_agent_defconfig
          make -j$(nproc)

      - name: Execute QEMU TCG Acceptance Run & Generate Receipt
        run: |
          set -o pipefail
          # Verify KVM capability (Expected: missing on GitHub runners)
          [ -e /dev/kvm ] && echo "KVM available" || echo "Note: /dev/kvm absent, running pure TCG emulation."

          # Run QEMU with serial capture to log output and test uptime gate (<5s)
          qemu-system-x86_64 \
            -kernel /tmp/buildroot/output/images/bzImage \
            -initrd /tmp/buildroot/output/images/rootfs.cpio.gz \
            -nographic \
            -no-reboot \
            -m 256M \
            -append "console=ttyS0 panic=1" | tee qemu_run.log

      - name: Validate Sandbox Gate & Record Receipt
        if: always()
        run: |
          echo "=== ARTIFACT & RECEIPT METRICS ==="
          if [ -f /tmp/buildroot/output/images/bzImage ]; then
            ls -lh /tmp/buildroot/output/images/bzImage /tmp/buildroot/output/images/rootfs.cpio.gz
            KERNEL_BYTES=$(stat -c%s /tmp/buildroot/output/images/bzImage)
            INITRD_BYTES=$(stat -c%s /tmp/buildroot/output/images/rootfs.cpio.gz)
            TOTAL_MB=$(awk -v k="$KERNEL_BYTES" -v i="$INITRD_BYTES" 'BEGIN{printf "%.1f", (k+i)/1048576}')
            echo "Artifact footprint: ${TOTAL_MB} MB (target < 15 MB)"
          else
            echo "Build images missing - build failed before QEMU. See build log."
          fi

          # Extract uptime line from run log; compute gate PASS/FAIL (non-blocking)
          if [ -f qemu_run.log ]; then
            UPTIME_LINE=$(grep "First agent action output at uptime" qemu_run.log | head -n 1)
            if [ -z "$UPTIME_LINE" ]; then
              echo "GATE RESULT: FAIL (uptime marker missing - guest never reached first agent action)"
            else
              UPTIME_S=$(echo "$UPTIME_LINE" | grep -oE '[0-9.]+' | head -n 1)
              GATE=$(awk -v u="$UPTIME_S" 'BEGIN{print (u < 5.0) ? "PASS" : "FAIL"}')
              echo "GATE RESULT: $GATE (uptime_s=$UPTIME_S, target < 5.0 on TCG)"
            fi
            if grep -q "PUPPF AGENT-CORE [ONLINE]" qemu_run.log; then
              echo "AGENT RESULT: ONLINE banner present - genuine agent-boot receipt achieved."
            else
              echo "AGENT RESULT: no ONLINE banner - check receipt-error branch in log."
            fi
          else
            echo "GATE RESULT: NOT RUN (qemu_run.log absent)"
          fi

          # Archive logs as run receipt (published to the branch by the next step)
          mkdir -p sandbox/receipts
          cp qemu_run.log sandbox/receipts/tcg-run-$(date +%s).log 2>/dev/null || true

      - name: Publish run receipt to the sandbox branch
        if: always()
        run: |
          git config user.name "puppf-sandbox-receipts"
          git config user.email "noreply@github.com"
          git add sandbox/receipts/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No receipt files to publish (build failed before QEMU produced a log)."
            exit 0
          fi
          git commit -m "sandbox: run receipt ${GITHUB_RUN_ID} [skip ci]"
          git push

      - name: Upload run receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puppf-sandbox-tcg-receipt
          path: |
            qemu_run.log
            sandbox/receipts/
          retention-days: 7
          if-no-files-found: warn
