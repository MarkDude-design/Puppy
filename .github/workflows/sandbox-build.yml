# PUPPF SANDBOX — one-static-binary floor, run #2 wiring (2026-11-10).
# Source: Gemini seat proposals; verbatim copies under sandbox/incoming/.
# Z annotations, cumulative:
#   rounds 2-5: workflow completion, permissions, timeout, chmod +x /init,
#   pipefail, computed non-blocking gate, static compile step, AGENT RESULT
#   check, receipt publication with [skip ci] + actor guard.
#   This round (after run #1 BUILD_FAILED in 32s):
#   8. Source fix: git.buildroot.net is not a served git repository (run #1
#      receipt, exit 128). Now pulls the Buildroot 2026.08 release tarball from
#      buildroot.org — same source family the main route pins. Tarball sha256
#      recorded in every receipt (sandbox grade: recorded, not gated).
#   9. Failure receipts publish: every run commits sandbox/receipts/run-<id>/
#      with summary.md (outcome, gate, agent result, footprint, source sha256);
#      build output is teed to build.log so failed compiles are diagnosable
#      from the branch; build-failure receipts carry the log tail.

name: Puppf Sandbox Build & TCG Run

on:
  push:
    branches: [ "sandbox/gemini-lab-20261110" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sandbox-build-and-run:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential \
            libncurses-dev \
            bc \
            rsync \
            cpio \
            unzip \
            wget \
            git \
            qemu-system-x86

      - name: Compile static agent-core
        run: |
          gcc -static -O2 -o board/puppf/overlay/bin/agent-core board/puppf/overlay/bin/agent-core.c
          chmod +x board/puppf/overlay/bin/agent-core
          file board/puppf/overlay/bin/agent-core

      - name: Build Buildroot Image Stack
        run: |
          set -o pipefail
          # Source: official Buildroot 2026.08 release tarball (buildroot.org).
          # Run #1 failed here with git.buildroot.net "repository not found" - see
          # sandbox/reviews/Z-REVIEW-no-busybox-and-first-run-2026-11-10.md
          wget -q https://buildroot.org/downloads/buildroot-2026.08.tar.gz
          sha256sum buildroot-2026.08.tar.gz
          tar -xzf buildroot-2026.08.tar.gz -C /tmp
          mv /tmp/buildroot-2026.08 /tmp/buildroot
          cp configs/puppy_agent_defconfig /tmp/buildroot/configs/

          # Copy overlay into buildroot tree
          mkdir -p /tmp/buildroot/board/puppf/overlay
          cp -r board/puppf/overlay/* /tmp/buildroot/board/puppf/overlay/
          chmod +x /tmp/buildroot/board/puppf/overlay/init

          cd /tmp/buildroot
          make puppy_agent_defconfig
          make -j$(nproc) 2>&1 | tee "$GITHUB_WORKSPACE/build.log"

      - name: Execute QEMU TCG Acceptance Run & Generate Receipt
        run: |
          set -o pipefail
          # Verify KVM capability (Expected: missing on GitHub runners)
          [ -e /dev/kvm ] && echo "KVM available" || echo "Note: /dev/kvm absent, running pure TCG emulation."

          # Run QEMU with serial capture to log output and test uptime gate (<5s)
          qemu-system-x86_64 \
            -kernel /tmp/buildroot/output/images/bzImage \
            -initrd /tmp/buildroot/output/images/rootfs.cpio.gz \
            -nographic \
            -no-reboot \
            -m 256M \
            -append "console=ttyS0 panic=1" | tee qemu_run.log

      - name: Record Receipt (all outcomes)
        if: always()
        run: |
          RECEIPT_DIR="sandbox/receipts/run-${GITHUB_RUN_ID}"
          mkdir -p "$RECEIPT_DIR"
          {
            echo "# Puppf sandbox run receipt"
            echo ""
            echo "- Run: ${GITHUB_RUN_ID} (attempt ${GITHUB_RUN_ATTEMPT})"
            echo "- Date: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "- Source: Buildroot 2026.08 release tarball (buildroot.org)"
            if [ -f buildroot-2026.08.tar.gz ]; then
              echo "- Buildroot tarball sha256: $(sha256sum buildroot-2026.08.tar.gz | awk '{print $1}')"
            fi
          } > "$RECEIPT_DIR/summary.md"

          if [ -f /tmp/buildroot/output/images/bzImage ]; then
            KERNEL_BYTES=$(stat -c%s /tmp/buildroot/output/images/bzImage)
            INITRD_BYTES=$(stat -c%s /tmp/buildroot/output/images/rootfs.cpio.gz)
            TOTAL_MB=$(awk -v k="$KERNEL_BYTES" -v i="$INITRD_BYTES" 'BEGIN{printf "%.1f", (k+i)/1048576}')
            echo "- Artifact footprint: ${TOTAL_MB} MB (target < 15 MB)" >> "$RECEIPT_DIR/summary.md"
          fi

          if [ -f qemu_run.log ]; then
            cp qemu_run.log "$RECEIPT_DIR/"
            UPTIME_LINE=$(grep "First agent action output at uptime" qemu_run.log | head -n 1)
            if [ -z "$UPTIME_LINE" ]; then
              GATE_RESULT="FAIL (uptime marker missing - guest never reached first agent action)"
            else
              UPTIME_S=$(echo "$UPTIME_LINE" | grep -oE '[0-9.]+' | head -n 1)
              GATE=$(awk -v u="$UPTIME_S" 'BEGIN{print (u < 5.0) ? "PASS" : "FAIL"}')
              GATE_RESULT="$GATE (uptime_s=$UPTIME_S, target < 5.0 on TCG)"
            fi
            if grep -q "PUPPF AGENT-CORE [ONLINE]" qemu_run.log; then
              AGENT_RESULT="ONLINE banner present - genuine agent-boot receipt achieved."
            else
              AGENT_RESULT="no ONLINE banner - check receipt-error branch in log."
            fi
          else
            GATE_RESULT="NOT RUN (no QEMU log - build or earlier step failed)"
            AGENT_RESULT="NOT RUN"
            if [ -f build.log ]; then
              tail -n 200 build.log > "$RECEIPT_DIR/build-tail.log"
              echo "- Build log tail: build-tail.log in this directory" >> "$RECEIPT_DIR/summary.md"
            fi
          fi
          {
            echo "- GATE RESULT: $GATE_RESULT"
            echo "- AGENT RESULT: $AGENT_RESULT"
          } >> "$RECEIPT_DIR/summary.md"
          cat "$RECEIPT_DIR/summary.md"

      - name: Publish run receipt to the sandbox branch
        if: always()
        run: |
          git config user.name "puppf-sandbox-receipts"
          git config user.email "noreply@github.com"
          git add sandbox/receipts/ 2>/dev/null || true
          if git diff --staged --quiet; then
            echo "No receipt files to publish."
            exit 0
          fi
          git commit -m "sandbox: run receipt ${GITHUB_RUN_ID} [skip ci]"
          # Z fix #10 (run #2 publish race): the branch moved mid-run (curator
          # bank commit landed 18:55Z while the run was building), so the plain
          # push was rejected non-fast-forward and the receipt never reached
          # the branch — the owner had to extract it from the Actions artifact.
          # Rebase the receipt commit onto the current remote head before push.
          git pull --rebase origin sandbox/gemini-lab-20261110
          git push

      - name: Upload run receipt
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: puppf-sandbox-tcg-receipt
          path: |
            qemu_run.log
            build.log
            sandbox/receipts/
          retention-days: 7
          if-no-files-found: warn
